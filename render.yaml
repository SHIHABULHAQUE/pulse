# Render.com blueprint (free tier works for chat; free instances sleep after ~15 min idle).
services:
  - type: web
    name: pulse
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false   # set to https://your-domain after attaching it
      # Optional TURN relay for voice on strict mobile networks (e.g. a hosted TURN service):
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
